<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#572670"/>
      <stop offset="100%" style="stop-color:#7B3FA0"/>
    </linearGradient>
    <linearGradient id="rightBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B6BB8;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#C4A0DC;stop-opacity:0.85"/>
    </linearGradient>
    <radialGradient id="rightGlow2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#E9D5FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#C4A0DC;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#E9D5FF;stop-opacity:0.8"/>
    </linearGradient>
    <linearGradient id="checkGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86EFAC"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <filter id="dropShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid purple background -->
  <rect width="1200" height="628" fill="url(#bg2)"/>

  <!-- Right panel -->
  <ellipse cx="900" cy="314" rx="420" ry="380" fill="url(#rightBg2)"/>
  <ellipse cx="900" cy="314" rx="320" ry="290" fill="url(#rightGlow2)"/>

  <!-- Stack of pills (faded) on right -->
  <g transform="translate(820, 200)" opacity="0.55" filter="url(#dropShadow2)">
    <rect x="-50" y="-18" width="100" height="36" rx="18" fill="url(#pillGrad2)"/>
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#7B3FA0" stroke-width="2"/>
  </g>
  <g transform="translate(960, 240) rotate(15)" opacity="0.45" filter="url(#dropShadow2)">
    <rect x="-45" y="-16" width="90" height="32" rx="16" fill="url(#pillGrad2)"/>
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#7B3FA0" stroke-width="2"/>
  </g>
  <g transform="translate(870, 290) rotate(-12)" opacity="0.4" filter="url(#dropShadow2)">
    <rect x="-42" y="-15" width="84" height="30" rx="15" fill="url(#pillGrad2)"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#7B3FA0" stroke-width="2"/>
  </g>

  <!-- Large X over pills -->
  <g opacity="0.7" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round">
    <line x1="780" y1="170" x2="990" y2="320"/>
    <line x1="990" y1="170" x2="780" y2="320"/>
  </g>

  <!-- Brain with check (TMS works) below -->
  <g transform="translate(900, 440)" filter="url(#dropShadow2)">
    <!-- Brain background -->
    <circle cx="0" cy="0" r="100" fill="#FFFFFF" opacity="0.18"/>
    <!-- Brain shape simplified -->
    <path d="M-55,-40 C-85,-45 -100,-25 -100,0 C-100,28 -80,50 -50,55 L-50,55 L-50,-50 C-52,-50 -54,-45 -55,-40 Z"
          fill="#FFFFFF" opacity="0.85"/>
    <path d="M55,-40 C85,-45 100,-25 100,0 C100,28 80,50 50,55 L50,55 L50,-50 C52,-50 54,-45 55,-40 Z"
          fill="#FFFFFF" opacity="0.85"/>
    <line x1="0" y1="-50" x2="0" y2="55" stroke="#7B3FA0" stroke-width="1.5" opacity="0.5" stroke-dasharray="3,3"/>
    <!-- Folds -->
    <path d="M-78,-15 C-65,-20 -52,-12 -47,-2" fill="none" stroke="#7B3FA0" stroke-width="2" opacity="0.5"/>
    <path d="M-78,18 C-65,12 -52,22 -48,38" fill="none" stroke="#7B3FA0" stroke-width="2" opacity="0.5"/>
    <path d="M78,-15 C65,-20 52,-12 47,-2" fill="none" stroke="#7B3FA0" stroke-width="2" opacity="0.5"/>
    <path d="M78,18 C65,12 52,22 48,38" fill="none" stroke="#7B3FA0" stroke-width="2" opacity="0.5"/>

    <!-- Green check overlay -->
    <circle cx="80" cy="55" r="28" fill="url(#checkGrad2)"/>
    <path d="M67,55 L77,65 L93,45" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Left side: Title text -->
  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">WHY TMS WORKS</text>
  <text x="80" y="258" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">WHEN 4</text>
  <text x="80" y="316" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">ANTIDEPRESSANTS</text>
  <text x="80" y="374" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">DIDN'T</text>

  <!-- Subtitle -->
  <text x="80" y="430" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#E9D5FF" opacity="0.95">A Psychiatrist Explains</text>

  <!-- By line -->
  <text x="80" y="510" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.8">By - Karma TMS</text>
</svg>
