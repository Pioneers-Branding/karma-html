<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e0a3c;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#4c1d95;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="overlayGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e0a3c;stop-opacity:1"/>
      <stop offset="58%" style="stop-color:#1e0a3c;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#1e0a3c;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0abfc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pillGradRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fca5a5;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#86efac;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow2">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad2)"/>

  <!-- Subtle dot pattern -->
  <g opacity="0.07">
    <circle cx="460" cy="60" r="2" fill="white"/><circle cx="510" cy="60" r="2" fill="white"/>
    <circle cx="560" cy="60" r="2" fill="white"/><circle cx="610" cy="60" r="2" fill="white"/>
    <circle cx="660" cy="60" r="2" fill="white"/><circle cx="710" cy="60" r="2" fill="white"/>
    <circle cx="760" cy="60" r="2" fill="white"/>
    <circle cx="460" cy="110" r="2" fill="white"/><circle cx="510" cy="110" r="2" fill="white"/>
    <circle cx="560" cy="110" r="2" fill="white"/><circle cx="610" cy="110" r="2" fill="white"/>
    <circle cx="660" cy="110" r="2" fill="white"/><circle cx="710" cy="110" r="2" fill="white"/>
    <circle cx="760" cy="110" r="2" fill="white"/>
    <circle cx="460" cy="160" r="2" fill="white"/><circle cx="510" cy="160" r="2" fill="white"/>
    <circle cx="560" cy="160" r="2" fill="white"/><circle cx="610" cy="160" r="2" fill="white"/>
    <circle cx="660" cy="160" r="2" fill="white"/><circle cx="710" cy="160" r="2" fill="white"/>
    <circle cx="460" cy="210" r="2" fill="white"/><circle cx="510" cy="210" r="2" fill="white"/>
    <circle cx="560" cy="210" r="2" fill="white"/><circle cx="610" cy="210" r="2" fill="white"/>
    <circle cx="660" cy="210" r="2" fill="white"/><circle cx="710" cy="210" r="2" fill="white"/>
    <circle cx="760" cy="210" r="2" fill="white"/>
    <circle cx="460" cy="260" r="2" fill="white"/><circle cx="510" cy="260" r="2" fill="white"/>
    <circle cx="560" cy="260" r="2" fill="white"/><circle cx="610" cy="260" r="2" fill="white"/>
    <circle cx="660" cy="260" r="2" fill="white"/><circle cx="710" cy="260" r="2" fill="white"/>
    <circle cx="460" cy="310" r="2" fill="white"/><circle cx="510" cy="310" r="2" fill="white"/>
    <circle cx="560" cy="310" r="2" fill="white"/><circle cx="610" cy="310" r="2" fill="white"/>
    <circle cx="660" cy="310" r="2" fill="white"/><circle cx="710" cy="310" r="2" fill="white"/>
    <circle cx="760" cy="310" r="2" fill="white"/>
    <circle cx="460" cy="360" r="2" fill="white"/><circle cx="510" cy="360" r="2" fill="white"/>
    <circle cx="560" cy="360" r="2" fill="white"/><circle cx="610" cy="360" r="2" fill="white"/>
    <circle cx="660" cy="360" r="2" fill="white"/><circle cx="710" cy="360" r="2" fill="white"/>
  </g>

  <!-- Right side illustration -->
  <!-- Medication pills (faded/crossed out - representing failed antidepressants) -->
  <!-- Pill 1 -->
  <g transform="translate(520, 130) rotate(-25)" opacity="0.45" filter="url(#softShadow2)">
    <rect x="-30" y="-12" width="60" height="24" rx="12" fill="url(#pillGradRed)"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="rgba(239,68,68,0.5)" stroke-width="1.5"/>
    <text x="0" y="0" font-family="Arial" font-size="8" fill="rgba(239,68,68,0.7)" text-anchor="middle" dy="3">Rx</text>
  </g>
  <!-- Pill 2 -->
  <g transform="translate(600, 155) rotate(15)" opacity="0.4" filter="url(#softShadow2)">
    <rect x="-28" y="-11" width="56" height="22" rx="11" fill="url(#pillGradRed)"/>
    <line x1="0" y1="-11" x2="0" y2="11" stroke="rgba(239,68,68,0.5)" stroke-width="1.5"/>
  </g>
  <!-- Pill 3 -->
  <g transform="translate(555, 185) rotate(-10)" opacity="0.35" filter="url(#softShadow2)">
    <rect x="-25" y="-10" width="50" height="20" rx="10" fill="url(#pillGradRed)"/>
    <line x1="0" y1="-10" x2="0" y2="10" stroke="rgba(239,68,68,0.5)" stroke-width="1"/>
  </g>
  <!-- Pill 4 -->
  <g transform="translate(635, 120) rotate(30)" opacity="0.3">
    <rect x="-22" y="-9" width="44" height="18" rx="9" fill="url(#pillGradRed)"/>
  </g>

  <!-- X marks over pills -->
  <g opacity="0.55" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round">
    <line x1="500" y1="118" x2="518" y2="136"/>
    <line x1="518" y1="118" x2="500" y2="136"/>
    <line x1="578" y1="143" x2="594" y2="159"/>
    <line x1="594" y1="143" x2="578" y2="159"/>
    <line x1="537" y1="176" x2="551" y2="192"/>
    <line x1="551" y1="176" x2="537" y2="192"/>
    <line x1="618" y1="110" x2="630" y2="122"/>
    <line x1="630" y1="110" x2="618" y2="122"/>
  </g>

  <!-- Arrow pointing down-right, then VS divider -->
  <g transform="translate(575, 220)" opacity="0.7" filter="url(#glow2)">
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#c084fc" stroke-width="2"/>
    <text x="0" y="5" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#c084fc" text-anchor="middle" font-weight="bold">VS</text>
  </g>

  <!-- TMS Brain target with green check (success) -->
  <g transform="translate(570, 290)" filter="url(#softShadow2)">
    <!-- Brain circle background -->
    <circle cx="0" cy="0" r="68" fill="#7c3aed" opacity="0.18"/>
    <circle cx="0" cy="0" r="55" fill="#7c3aed" opacity="0.12"/>
    <!-- Brain simplified -->
    <path d="M-35,-28 C-55,-32 -68,-18 -68,-2 C-68,18 -52,36 -30,40 C-15,43 0,38 0,38
             C0,38 0,20 0,5 C0,-8 -10,-14 -18,-22 Z"
          fill="none" stroke="#e9d5ff" stroke-width="2" opacity="0.85"/>
    <path d="M35,-28 C55,-32 68,-18 68,-2 C68,18 52,36 30,40 C15,43 0,38 0,38
             C0,38 0,20 0,5 C0,-8 10,-14 18,-22 Z"
          fill="none" stroke="#e9d5ff" stroke-width="2" opacity="0.85"/>
    <line x1="0" y1="-30" x2="0" y2="38" stroke="#c084fc" stroke-width="1" opacity="0.5" stroke-dasharray="3,2"/>
    <!-- Folds -->
    <path d="M-50,-8 C-40,-13 -30,-6 -26,5" fill="none" stroke="#c084fc" stroke-width="1.3" opacity="0.7"/>
    <path d="M-52,18 C-42,11 -32,20 -27,33" fill="none" stroke="#c084fc" stroke-width="1.3" opacity="0.7"/>
    <path d="M50,-8 C40,-13 30,-6 26,5" fill="none" stroke="#c084fc" stroke-width="1.3" opacity="0.7"/>
    <path d="M52,18 C42,11 32,20 27,33" fill="none" stroke="#c084fc" stroke-width="1.3" opacity="0.7"/>

    <!-- Pulse rings from TMS -->
    <circle cx="0" cy="-45" r="8" fill="url(#pillGrad)" opacity="0.9"/>
    <circle cx="0" cy="-45" r="16" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="-45" r="24" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.35"/>

    <!-- Green check circle -->
    <circle cx="52" cy="38" r="18" fill="url(#checkGrad)" opacity="0.92"/>
    <path d="M43,38 L50,45 L63,30" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "58%" success stat -->
  <g transform="translate(695, 310)" filter="url(#glow2)">
    <rect x="-38" y="-28" width="76" height="56" rx="10" fill="#7c3aed" opacity="0.35"/>
    <rect x="-38" y="-28" width="76" height="56" rx="10" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-5" font-family="Georgia, serif" font-size="22" fill="#f0abfc" text-anchor="middle" font-weight="bold">58%</text>
    <text x="0" y="16" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#e9d5ff" text-anchor="middle">Response Rate</text>
  </g>

  <!-- Left gradient overlay -->
  <rect width="490" height="420" fill="url(#overlayGrad2)"/>

  <!-- Decorative accent bar -->
  <rect x="50" y="55" width="5" height="100" rx="3" fill="#c084fc" opacity="0.75"/>

  <!-- Title text -->
  <text x="72" y="107" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="white" opacity="0.98">THE REASON TMS</text>
  <text x="72" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="white" opacity="0.98">WORKS WHEN</text>
  <text x="72" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#f0abfc" opacity="0.98">ANTIDEPRESSANTS</text>
  <text x="72" y="224" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#f0abfc" opacity="0.98">DIDN'T</text>

  <!-- Divider -->
  <line x1="72" y1="248" x2="310" y2="248" stroke="#7c3aed" stroke-width="1" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="72" y="271" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#e9d5ff" opacity="0.85">A Psychiatrist Explains</text>

  <!-- Author -->
  <text x="72" y="300" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d8b4fe" opacity="0.9">By — Karma TMS</text>

  <!-- Category pill -->
  <rect x="72" y="320" width="130" height="26" rx="13" fill="#6d28d9" opacity="0.75"/>
  <text x="137" y="338" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">TREATMENT-RESISTANT</text>

  <!-- Bottom dots -->
  <circle cx="72" cy="380" r="3" fill="#c084fc" opacity="0.5"/>
  <circle cx="86" cy="380" r="3" fill="#a855f7" opacity="0.35"/>
  <circle cx="100" cy="380" r="3" fill="#7c3aed" opacity="0.25"/>
</svg>
