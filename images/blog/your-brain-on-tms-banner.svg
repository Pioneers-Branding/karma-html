<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#572670"/>
      <stop offset="100%" style="stop-color:#7B3FA0"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B6BB8;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#C4A0DC;stop-opacity:0.85"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#E9D5FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#C4A0DC;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#E9D5FF;stop-opacity:0.85"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid purple background -->
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- Right panel (lighter purple oval area) -->
  <ellipse cx="900" cy="314" rx="420" ry="380" fill="url(#rightBg)"/>
  <ellipse cx="900" cy="314" rx="320" ry="290" fill="url(#rightGlow)"/>

  <!-- Brain illustration on right -->
  <g transform="translate(900, 314)" filter="url(#dropShadow)">
    <!-- Outer brain shape -->
    <path d="M-110,-50 C-160,-60 -190,-25 -185,15 C-180,55 -150,95 -100,105 C-70,110 -40,100 -10,90 L-10,90 L-10,-90 C-40,-90 -70,-80 -90,-70 C-100,-65 -105,-58 -110,-50 Z"
          fill="url(#brainGrad)" opacity="0.85"/>
    <path d="M110,-50 C160,-60 190,-25 185,15 C180,55 150,95 100,105 C70,110 40,100 10,90 L10,90 L10,-90 C40,-90 70,-80 90,-70 C100,-65 105,-58 110,-50 Z"
          fill="url(#brainGrad)" opacity="0.85"/>
    <!-- Brain folds/details -->
    <path d="M-150,-10 C-130,-15 -110,-5 -100,10" fill="none" stroke="#7B3FA0" stroke-width="2.5" opacity="0.5"/>
    <path d="M-160,30 C-140,22 -115,32 -105,55" fill="none" stroke="#7B3FA0" stroke-width="2.5" opacity="0.5"/>
    <path d="M-130,-50 C-110,-45 -90,-30 -80,-10" fill="none" stroke="#7B3FA0" stroke-width="2.5" opacity="0.5"/>
    <path d="M150,-10 C130,-15 110,-5 100,10" fill="none" stroke="#7B3FA0" stroke-width="2.5" opacity="0.5"/>
    <path d="M160,30 C140,22 115,32 105,55" fill="none" stroke="#7B3FA0" stroke-width="2.5" opacity="0.5"/>
    <path d="M130,-50 C110,-45 90,-30 80,-10" fill="none" stroke="#7B3FA0" stroke-width="2.5" opacity="0.5"/>
    <!-- Center division -->
    <line x1="0" y1="-95" x2="0" y2="100" stroke="#7B3FA0" stroke-width="2" opacity="0.45" stroke-dasharray="4,4"/>
  </g>

  <!-- TMS coil above brain -->
  <g transform="translate(900, 170)" filter="url(#dropShadow)">
    <ellipse cx="0" cy="0" rx="80" ry="32" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="60" ry="22" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.75"/>
    <ellipse cx="0" cy="0" rx="40" ry="14" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
    <!-- Handle -->
    <rect x="-12" y="-78" width="24" height="60" rx="8" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Pulse waves emanating -->
  <g transform="translate(900, 220)" opacity="0.55">
    <ellipse cx="0" cy="0" rx="50" ry="18" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="80" ry="28" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="115" ry="40" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.45"/>
  </g>

  <!-- Left side: Title text -->
  <text x="80" y="240" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" letter-spacing="-1">YOUR BRAIN</text>
  <text x="80" y="310" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="900" fill="#FFFFFF" letter-spacing="-1">ON TMS</text>

  <!-- Subtitle -->
  <text x="80" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#E9D5FF" opacity="0.95">What Actually Happens During</text>
  <text x="80" y="402" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#E9D5FF" opacity="0.95">Those 20 Minutes</text>

  <!-- By line -->
  <text x="80" y="490" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.8">By - Karma TMS</text>
</svg>
