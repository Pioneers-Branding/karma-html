<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d0a5e;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#5b1d9a;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.85"/>
    </linearGradient>
    <linearGradient id="overlayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d0a5e;stop-opacity:1"/>
      <stop offset="60%" style="stop-color:#2d0a5e;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#2d0a5e;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e9d5ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="60" x2="800" y2="60" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="white" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="420" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke="white" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke="white" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="420" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="white" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Right side illustration: Brain with TMS coil and pulse waves -->
  <!-- Brain outline -->
  <g transform="translate(490, 210)" filter="url(#softShadow)">
    <!-- Brain silhouette -->
    <ellipse cx="10" cy="0" rx="95" ry="80" fill="url(#brainGrad)" opacity="0.15"/>
    <!-- Brain left hemisphere -->
    <path d="M-40,-60 C-80,-65 -110,-40 -110,-5 C-110,35 -85,65 -50,72 C-30,76 -10,70 10,65
             C10,65 10,40 10,20 C10,0 -5,-10 -15,-25 C-25,-40 -30,-55 -40,-60 Z"
          fill="none" stroke="url(#brainGrad)" stroke-width="2.5" opacity="0.9"/>
    <!-- Brain right hemisphere -->
    <path d="M60,-60 C100,-65 125,-38 122,-5 C119,32 96,62 62,72 C42,78 20,70 10,65
             C10,65 10,40 10,20 C10,0 22,-8 32,-22 C44,-38 48,-55 60,-60 Z"
          fill="none" stroke="url(#brainGrad)" stroke-width="2.5" opacity="0.9"/>
    <!-- Brain center line -->
    <line x1="10" y1="-62" x2="10" y2="65" stroke="#e9d5ff" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
    <!-- Brain folds left -->
    <path d="M-85,-15 C-70,-20 -55,-10 -50,5" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <path d="M-90,20 C-75,12 -58,22 -52,38" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <path d="M-65,-40 C-52,-35 -42,-20 -38,-5" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <!-- Brain folds right -->
    <path d="M95,-15 C80,-20 65,-10 60,5" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <path d="M98,20 C83,12 66,22 60,38" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
    <path d="M75,-40 C62,-35 52,-20 48,-5" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- TMS Coil above brain -->
  <g transform="translate(500, 120)" filter="url(#glow)">
    <!-- Coil body -->
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#f0abfc" stroke-width="4" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="#e879f9" stroke-width="3" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="28" ry="10" fill="none" stroke="#d946ef" stroke-width="2.5" opacity="0.7"/>
    <!-- Coil handle -->
    <rect x="-8" y="-50" width="16" height="50" rx="6" fill="#7c3aed" opacity="0.9"/>
    <rect x="-5" y="-50" width="10" height="50" rx="4" fill="#a855f7" opacity="0.7"/>
  </g>

  <!-- Magnetic pulse waves emanating from coil -->
  <g transform="translate(500, 148)" opacity="0.7" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="none" stroke="#f0abfc" stroke-width="2" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="50" ry="20" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="70" ry="28" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="90" ry="36" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.25"/>
  </g>

  <!-- Neural activity dots -->
  <g filter="url(#glow)">
    <circle cx="560" cy="230" r="4" fill="#f0abfc" opacity="0.9"/>
    <circle cx="590" cy="255" r="3" fill="#c084fc" opacity="0.8"/>
    <circle cx="535" cy="265" r="3.5" fill="#e879f9" opacity="0.85"/>
    <circle cx="615" cy="240" r="2.5" fill="#a855f7" opacity="0.7"/>
    <circle cx="480" cy="250" r="3" fill="#f0abfc" opacity="0.75"/>
    <circle cx="510" cy="280" r="2.5" fill="#c084fc" opacity="0.7"/>
    <circle cx="645" cy="265" r="3" fill="#e879f9" opacity="0.6"/>
    <!-- Connecting neural lines -->
    <line x1="560" y1="230" x2="590" y2="255" stroke="#c084fc" stroke-width="1" opacity="0.5"/>
    <line x1="590" y1="255" x2="535" y2="265" stroke="#a855f7" stroke-width="1" opacity="0.45"/>
    <line x1="615" y1="240" x2="590" y2="255" stroke="#c084fc" stroke-width="1" opacity="0.4"/>
    <line x1="480" y1="250" x2="510" y2="280" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    <line x1="510" y1="280" x2="535" y2="265" stroke="#c084fc" stroke-width="1" opacity="0.45"/>
  </g>

  <!-- EEG wave lines on right -->
  <g transform="translate(455, 340)" opacity="0.55">
    <polyline points="0,0 15,-8 25,14 40,-18 55,6 68,-4 80,10 95,-14 108,2 120,0"
              fill="none" stroke="#f0abfc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,0 12,-5 22,10 35,-12 48,4 60,-3 72,8 85,-10 98,1 120,0"
              fill="none" stroke="#c084fc" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" transform="translate(130,0)"/>
  </g>

  <!-- Left gradient overlay for text readability -->
  <rect width="480" height="420" fill="url(#overlayGrad)"/>

  <!-- Decorative accent bar -->
  <rect x="50" y="60" width="5" height="90" rx="3" fill="#c084fc" opacity="0.8"/>

  <!-- Title text -->
  <text x="72" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="white" opacity="0.98">YOUR BRAIN</text>
  <text x="72" y="158" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" fill="white" opacity="0.98">ON TMS</text>

  <!-- Subtitle -->
  <text x="72" y="200" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e9d5ff" opacity="0.85">What Actually Happens During</text>
  <text x="72" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e9d5ff" opacity="0.85">Those 20 Minutes</text>

  <!-- Divider line -->
  <line x1="72" y1="245" x2="300" y2="245" stroke="#a855f7" stroke-width="1" opacity="0.5"/>

  <!-- Author -->
  <text x="72" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#d8b4fe" opacity="0.9">By — Karma TMS</text>

  <!-- Category pill -->
  <rect x="72" y="295" width="120" height="26" rx="13" fill="#7c3aed" opacity="0.7"/>
  <text x="132" y="313" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="white" text-anchor="middle" font-weight="600">TMS THERAPY</text>

  <!-- Bottom decorative dots -->
  <circle cx="72" cy="370" r="3" fill="#c084fc" opacity="0.5"/>
  <circle cx="86" cy="370" r="3" fill="#a855f7" opacity="0.35"/>
  <circle cx="100" cy="370" r="3" fill="#7c3aed" opacity="0.25"/>
</svg>
