<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#572670"/>
      <stop offset="100%" style="stop-color:#7B3FA0"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B6BB8;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#C4A0DC;stop-opacity:0.85"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#E9D5FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#C4A0DC;stop-opacity:0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#60A96B"/>
    </linearGradient>
  </defs>

  <!-- Solid purple background -->
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- Right panel (lighter purple oval area) -->
  <ellipse cx="900" cy="314" rx="420" ry="380" fill="url(#rightBg)"/>
  <ellipse cx="900" cy="314" rx="320" ry="290" fill="url(#rightGlow)"/>

  <!-- Mental health ribbon on right side -->
  <g transform="translate(900, 314)" filter="url(#dropShadow)">

    <!-- Large green ribbon -->
    <g transform="translate(0, 0)">
      <!-- Ribbon loop left -->
      <path d="M-100,-140 C-160,-120 -180,-60 -170,-10 C-160,40 -120,80 -70,90 L-50,95 L-50,110 L-20,110 L-20,90 L-20,90 C-50,75 -80,30 -88,-20 C-96,-70 -80,-120 -20,-150 C-60,-145 -90,-140 -100,-140 Z"
            fill="url(#ribbonGrad)" opacity="0.9"/>
      <!-- Ribbon loop right -->
      <path d="M100,-140 C160,-120 180,-60 170,-10 C160,40 120,80 70,90 L50,95 L50,110 L20,110 L20,90 L20,90 C50,75 80,30 88,-20 C96,-70 80,-120 20,-150 C60,-145 90,-140 100,-140 Z"
            fill="url(#ribbonGrad)" opacity="0.9"/>
      <!-- Ribbon center knot -->
      <circle cx="0" cy="-100" r="25" fill="url(#ribbonGrad)" opacity="0.95"/>
      <circle cx="0" cy="-100" r="18" fill="#1B5E20" opacity="0.4"/>
      <!-- Ribbon tails -->
      <path d="M-20,-75 L-35,80 L-10,80 L0,-20 Z" fill="url(#ribbonGrad)" opacity="0.85"/>
      <path d="M20,-75 L35,80 L10,80 L0,-20 Z" fill="url(#ribbonGrad)" opacity="0.85"/>
    </g>

    <!-- Awareness theme circles (like confetti/hope) -->
    <circle cx="-200" cy="-200" r="18" fill="#4ADE80" opacity="0.5"/>
    <circle cx="-160" cy="-220" r="10" fill="#4ADE80" opacity="0.4"/>
    <circle cx="200" cy="-180" r="14" fill="#4ADE80" opacity="0.5"/>
    <circle cx="220" cy="-140" r="8" fill="#4ADE80" opacity="0.4"/>
    <circle cx="-180" cy="180" r="12" fill="#4ADE80" opacity="0.4"/>
    <circle cx="180" cy="200" r="16" fill="#4ADE80" opacity="0.45"/>
    <circle cx="-140" cy="220" r="9" fill="#4ADE80" opacity="0.35"/>

    <!-- Small heart in center of ribbon knot -->
    <path d="M0,-108 C-8,-120 -20,-112 -20,-100 C-20,-92 -12,-88 -8,-92 C-4,-96 0,-104 0,-104 C0,-104 4,-96 8,-92 C12,-88 20,-92 20,-100 C20,-112 8,-120 0,-108 Z"
          fill="#FFFFFF" opacity="0.9"/>

    <!-- Label -->
    <text x="0" y="160" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4ADE80" text-anchor="middle">Mental Health Matters</text>
  </g>

  <!-- Left side: Title text -->
  <text x="80" y="200" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#4ADE80" letter-spacing="2">MAY</text>

  <text x="80" y="260" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1">MENTAL HEALTH</text>
  <text x="80" y="330" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1">AWARENESS</text>
  <text x="80" y="400" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#FCD34D" letter-spacing="-1">MONTH</text>

  <!-- Subtitle -->
  <text x="80" y="460" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#E9D5FF" opacity="0.95">Why It Matters More Than Ever</text>

  <!-- Stars / emphasis dots -->
  <circle cx="80" cy="490" r="5" fill="#FCD34D" opacity="0.8"/>
  <circle cx="100" cy="490" r="3" fill="#FCD34D" opacity="0.6"/>
  <circle cx="115" cy="490" r="3" fill="#FCD34D" opacity="0.6"/>

  <!-- By line -->
  <text x="80" y="550" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.8">By - Dr. Keerthy Sunder</text>
</svg>