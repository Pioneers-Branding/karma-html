<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#572670"/>
      <stop offset="100%" style="stop-color:#7B3FA0"/>
    </linearGradient>
    <linearGradient id="rightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B6BB8;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#C4A0DC;stop-opacity:0.85"/>
    </linearGradient>
    <radialGradient id="rightGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" style="stop-color:#E9D5FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#C4A0DC;stop-opacity:0"/>
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid purple background -->
  <rect width="1200" height="628" fill="url(#bg)"/>

  <!-- Right panel (lighter purple oval area) -->
  <ellipse cx="900" cy="314" rx="420" ry="380" fill="url(#rightBg)"/>
  <ellipse cx="900" cy="314" rx="320" ry="290" fill="url(#rightGlow)"/>

  <!-- Comparison visual on right: TMS side vs ECT side -->
  <g transform="translate(900, 314)" filter="url(#dropShadow)">

    <!-- Divider line -->
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6,4" opacity="0.4"/>

    <!-- TMS Side (Left of divider) -->
    <g transform="translate(-130, 0)">
      <!-- Brain outline -->
      <path d="M-70,-50 C-110,-60 -140,-25 -135,15 C-130,55 -100,95 -50,105 C-20,110 10,100 40,90 L40,90 L40,-90 C10,-90 -20,-80 -40,-70 C-50,-65 -55,-58 -70,-50 Z"
            fill="url(#brainGrad)" opacity="0.85" transform="scale(0.8)"/>
      <!-- TMS coil ring -->
      <ellipse cx="0" cy="-120" rx="50" ry="20" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.9"/>
      <ellipse cx="0" cy="-120" rx="35" ry="14" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
      <!-- Handle -->
      <rect x="-8" y="-158" width="16" height="50" rx="5" fill="#FFFFFF" opacity="0.9"/>
      <!-- Pulse ring (gentle) -->
      <ellipse cx="0" cy="-80" rx="40" ry="15" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>
      <!-- Label -->
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#4ADE80" text-anchor="middle">TMS</text>
      <text x="0" y="165" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.8" text-anchor="middle">Focused Magnetic Pulses</text>
      <text x="0" y="183" font-family="Arial, sans-serif" font-size="12" fill="#4ADE80" opacity="0.9" text-anchor="middle">No Seizure Risk</text>
    </g>

    <!-- VS circle -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="28" fill="#FFFFFF" opacity="0.15"/>
      <text x="0" y="8" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="0.9">VS</text>
    </g>

    <!-- ECT Side (Right of divider) -->
    <g transform="translate(130, 0)">
      <!-- Brain outline -->
      <path d="M70,-50 C110,-60 140,-25 135,15 C130,55 100,95 50,105 C20,110 -10,100 -40,90 L-40,90 L-40,-90 C-10,-90 20,-80 40,-70 C50,-65 55,-58 70,-50 Z"
            fill="url(#brainGrad)" opacity="0.85" transform="scale(0.8)"/>
      <!-- Electrode pads -->
      <circle cx="-30" cy="-20" r="12" fill="#EF4444" opacity="0.8"/>
      <circle cx="30" cy="-20" r="12" fill="#EF4444" opacity="0.8"/>
      <circle cx="-30" cy="40" r="12" fill="#EF4444" opacity="0.8"/>
      <circle cx="30" cy="40" r="12" fill="#EF4444" opacity="0.8"/>
      <!-- Electric bolt symbol -->
      <path d="M 5 -70 L -8 -35 L 5 -40 L -5 -5 L 20 -45 L 5 -48 L 15 -75 Z" fill="#EF4444" opacity="0.9"/>
      <!-- Label -->
      <text x="0" y="140" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#EF4444" text-anchor="middle">ECT</text>
      <text x="0" y="165" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" opacity="0.8" text-anchor="middle">Electric Current</text>
      <text x="0" y="183" font-family="Arial, sans-serif" font-size="12" fill="#EF4444" opacity="0.9" text-anchor="middle">Seizure Required</text>
    </g>
  </g>

  <!-- Left side: Title text -->
  <text x="80" y="240" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#FFFFFF" letter-spacing="-1">IS TMS SHOCK</text>
  <text x="80" y="310" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#FCD34D" letter-spacing="-1">THERAPY?</text>

  <!-- Subtitle -->
  <text x="80" y="370" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#E9D5FF" opacity="0.95">The Truth About TMS vs. ECT</text>

  <!-- X mark over "shock" to debunk -->
  <text x="80" y="430" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#4ADE80" font-weight="600">✓ Debunking the myth</text>

  <!-- By line -->
  <text x="80" y="500" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#FFFFFF" opacity="0.8">By - Dr. Keerthy Sunder</text>
</svg>