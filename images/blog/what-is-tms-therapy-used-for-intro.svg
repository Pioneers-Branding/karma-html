<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1a2e"/>
      <stop offset="35%" style="stop-color:#1a2a4a"/>
      <stop offset="100%" style="stop-color:#572670"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B3FA0;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#572670;stop-opacity:0.2"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="0" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Glow accents -->
  <rect width="1200" height="630" fill="url(#accentGlow)"/>
  <circle cx="300" cy="200" r="250" fill="#ffffff" opacity="0.02"/>
  <circle cx="900" cy="400" r="200" fill="#7B3FA0" opacity="0.05"/>

  <!-- Brain with neural network connections -->
  <g transform="translate(600, 210)" filter="url(#cardShadow)">
    <!-- Outer glow ring -->
    <circle cx="0" cy="0" r="110" fill="#ffffff" opacity="0.05"/>

    <!-- Brain outline -->
    <path d="M -70 -55 Q -35 -85 0 -55 Q 35 -85 70 -55 Q 100 -25 70 5 Q 100 35 70 65 Q 35 95 0 65 Q -35 95 -70 65 Q -100 35 -70 5 Q -100 -25 -70 -55 Z"
          fill="#ffffff" opacity="0.15"/>

    <!-- Inner brain detail -->
    <path d="M -45 -40 Q -22 -58 0 -40 Q 22 -58 45 -40 Q 65 -22 45 0 Q 65 22 45 40 Q 22 58 0 40 Q -22 58 -45 40 Q -65 22 -45 0 Q -65 -22 -45 -40 Z"
          fill="#7B3FA0" opacity="0.25"/>
  </g>

  <!-- Neural network lines / nodes around brain -->
  <g opacity="0.5" stroke="#FFD700" stroke-width="1.5" fill="none">
    <line x1="480" y1="180" x2="530" y2="210"/>
    <line x1="720" y1="180" x2="670" y2="210"/>
    <line x1="450" y1="280" x2="520" y2="250"/>
    <line x1="750" y1="280" x2="680" y2="250"/>
    <line x1="500" y1="350" x2="550" y2="310"/>
    <line x1="700" y1="350" x2="650" y2="310"/>
  </g>
  <g>
    <circle cx="480" cy="180" r="5" fill="#FFD700" opacity="0.8" filter="url(#iconGlow)"/>
    <circle cx="720" cy="180" r="5" fill="#FFD700" opacity="0.8" filter="url(#iconGlow)"/>
    <circle cx="450" cy="280" r="4" fill="#FFD700" opacity="0.6" filter="url(#iconGlow)"/>
    <circle cx="750" cy="280" r="4" fill="#FFD700" opacity="0.6" filter="url(#iconGlow)"/>
    <circle cx="500" cy="350" r="4" fill="#FFD700" opacity="0.5" filter="url(#iconGlow)"/>
    <circle cx="700" cy="350" r="4" fill="#FFD700" opacity="0.5" filter="url(#iconGlow)"/>
    <circle cx="550" cy="150" r="3" fill="#ffffff" opacity="0.5" filter="url(#iconGlow)"/>
    <circle cx="650" cy="150" r="3" fill="#ffffff" opacity="0.5" filter="url(#iconGlow)"/>
  </g>

  <!-- Central tool/medical icon - magnifying glass or diagnostic tool -->
  <g transform="translate(600, 210)" filter="url(#iconGlow)">
    <circle cx="0" cy="0" r="32" fill="#FFD700" opacity="0.95"/>
    <circle cx="0" cy="0" r="24" fill="#572670" opacity="0.9"/>
    <circle cx="0" cy="0" r="16" fill="#FFD700" opacity="0.3"/>
    <!-- Plus sign in center -->
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title Text -->
  <text x="600" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#cardShadow)">
    What Is TMS Therapy
  </text>
  <text x="600" y="465" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="bold" fill="#FFD700" text-anchor="middle" filter="url(#cardShadow)">
    Used For?
  </text>

  <!-- Subtitle -->
  <text x="600" y="520" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.85" text-anchor="middle">
    FDA-approved &amp; emerging applications for brain health
  </text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.25"/>
  <text x="600" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" opacity="0.75" text-anchor="middle" letter-spacing="1">
    Karma TMS | Board-Certified Psychiatry
  </text>
</svg>
