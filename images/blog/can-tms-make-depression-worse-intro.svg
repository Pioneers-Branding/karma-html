<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="40%" style="stop-color:#572670"/>
      <stop offset="100%" style="stop-color:#7B3FA0"/>
    </linearGradient>
    <linearGradient id="warmGlow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="lightBreak" cx="50%" cy="80%" r="60%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Light breaking through from bottom -->
  <rect width="1200" height="630" fill="url(#warmGlow)"/>
  <rect width="1200" height="630" fill="url(#lightBreak)"/>

  <!-- Decorative subtle circles -->
  <circle cx="200" cy="150" r="180" fill="#ffffff" opacity="0.02"/>
  <circle cx="1000" cy="480" r="250" fill="#ffffff" opacity="0.02"/>
  <circle cx="600" cy="315" r="350" fill="#ffffff" opacity="0.015"/>

  <!-- Abstract human silhouette / figure suggesting person with head/brain area -->
  <g transform="translate(600, 240)" filter="url(#softShadow)">
    <!-- Shoulders/body suggestion -->
    <ellipse cx="0" cy="90" rx="140" ry="60" fill="#ffffff" opacity="0.08"/>
    <!-- Head -->
    <circle cx="0" cy="-10" r="75" fill="#ffffff" opacity="0.12"/>
    <!-- Brain area glow -->
    <circle cx="0" cy="-10" r="55" fill="#FFD700" opacity="0.15"/>
  </g>

  <!-- Floating particles / neural sparks -->
  <g opacity="0.6">
    <circle cx="380" cy="200" r="3" fill="#FFD700" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="180" r="2.5" fill="#FFD700" opacity="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="320" r="2" fill="#ffffff" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="300" r="3" fill="#FFD700" opacity="0.5">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="150" r="2" fill="#ffffff" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="250" r="2.5" fill="#FFA500" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="260" r="2" fill="#ffffff" opacity="0.4"/>
    <circle cx="900" cy="220" r="2" fill="#FFD700" opacity="0.5"/>
  </g>

  <!-- Checkmark / reassurance icon -->
  <g transform="translate(600, 240)" filter="url(#glow)">
    <circle cx="0" cy="-10" r="42" fill="#FFD700" opacity="0.95"/>
    <path d="M -18 -10 L -6 2 L 18 -18" stroke="#572670" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#softShadow)">
    Can TMS Therapy Make
  </text>
  <text x="600" y="465" font-family="'Segoe UI', Arial, sans-serif" font-size="46" font-weight="bold" fill="#FFD700" text-anchor="middle" filter="url(#softShadow)">
    Depression Worse?
  </text>

  <!-- Subtitle with more detail -->
  <text x="600" y="520" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#ffffff" opacity="0.85" text-anchor="middle">
    Understanding safety, side effects &amp; what research shows
  </text>

  <!-- Bottom gradient bar -->
  <rect x="0" y="590" width="1200" height="40" fill="#000000" opacity="0.25"/>
  <text x="600" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#ffffff" opacity="0.75" text-anchor="middle" letter-spacing="1">
    Karma TMS | Board-Certified Psychiatry
  </text>
</svg>
